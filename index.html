<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessibility Escape Room — MyTelco</title>
<style>
  html,body{margin:0;background:#f4f6f9}
  #status{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6f9;
    color:#5a6572;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;z-index:9999;transition:opacity .3s;text-align:center;padding:24px;line-height:1.6}
  #status.hidden{opacity:0;pointer-events:none}
  #status .err{color:#b3261e;max-width:560px}
</style>
</head>
<body>
<div id="status" role="status">Loading the escape room…</div>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ===========================================================================
   11 planted defects. 4 a scanner can detect, 7 only a person can find.
   Each has a CORRECT counterpart nearby so participants can compare.
   =========================================================================== */
const BUGS = [
  { id:1, label:"Field naming", title:"The “Full name” field has no accessible name",
    pour:"Perceivable", wcag:"1.3.1 / 4.1.2", auto:"scanner",
    note:"The words “Full name” are just text on the page - there is no <label for>, no aria-label and no placeholder. A screen reader announces only “edit, blank”, so the user has no idea what to type.",
    compare:"The Email field below uses a proper <label for> - a screen reader announces “Email address, edit”. Tip: clicking the word “Email address” focuses the field; clicking “Full name” does nothing." },
  { id:2, label:"Text legibility", title:"The “last synced” line fails contrast",
    pour:"Perceivable", wcag:"1.4.3", auto:"scanner",
    note:"Light grey on white, around 2.2:1 - well under the 4.5:1 minimum for body text.",
    compare:"Compare with the other secondary text on the page, which passes." },
  { id:3, label:"Image alternative text", title:"The network status image has no alt text",
    pour:"Perceivable", wcag:"1.1.1", auto:"scanner",
    note:"The image carries real information (two regions fine, one degraded) with no text alternative.",
    compare:"Compare with the data-usage chart above it, which has a proper description." },
  { id:4, label:"Heading structure", title:"Heading level jumps from h1 to h4",
    pour:"Understandable", wcag:"1.3.1", auto:"scanner",
    note:"“Manage your plan” is an h4 directly after the h1, breaking the outline screen-reader users navigate by.",
    compare:"“Your usage” above it is a correct h2." },
  { id:5, label:"Button behaviour", title:"“Downgrade plan” is a <div>, not a button",
    pour:"Operable", wcag:"4.1.2", auto:"human",
    note:"No role, not in the tab order, no key handler. A scanner passes it clean; keyboard and screen-reader testing expose it.",
    compare:"“Upgrade plan” beside it is a real button - Tab reaches it and it shows a focus ring." },
  { id:6, label:"Focus indication", title:"Focus ring removed on the quick links",
    pour:"Operable", wcag:"2.4.7", auto:"human",
    note:"The three quick links suppress their focus outline, so keyboard users cannot see where they are.",
    compare:"Every other control on this page shows a clear amber focus ring - Tab through and watch it disappear." },
  { id:7, label:"Dialog behaviour", title:"The “Support hours” dialog traps the keyboard",
    pour:"Operable", wcag:"2.1.2 / 2.4.3", auto:"human",
    note:"Focus is pulled into the dialog, then Tab and Esc are both swallowed and the only close control is a <div>. There is no keyboard way out - you have to reach for the mouse. Focus is also not returned to the trigger afterwards.",
    compare:"The “Show plan details” button is a correct disclosure - reachable by Tab, toggled with Enter or Space, and its open state is announced via aria-expanded." },
  { id:8, label:"Error feedback", title:"The ticket form error is never announced",
    pour:"Understandable", wcag:"3.3.1 / 4.1.3", auto:"human",
    note:"The message appears visually but sits in a plain <div> - no live region, not linked to the field. A screen-reader user presses Submit and hears nothing at all.",
    compare:"Press Subscribe on the newsletter beside it: that message sits in an always-present role=\"status\" live region, so it is announced immediately." },
  { id:9, label:"Table structure", title:"Usage figures sit in a table with no header cells",
    pour:"Perceivable", wcag:"1.3.1", auto:"human",
    note:"The plan / data / devices figures are a real <table> but there is no <th>, no scope and no caption. Sighted users get the labels from the layout; a screen reader reads “CHF 49.90, 18 GB, 4” and then the labels separately, with nothing tying them together.",
    compare:"The fix is <th scope=\"col\"> for the labels plus a caption. Tip: static figures do not need to be reachable by Tab - that part is fine. The failure is the missing structure." },
  { id:10, label:"Status indication", title:"Network status is shown by dot colour alone",
    pour:"Perceivable", wcag:"1.4.1 Use of Color", auto:"human",
    note:"Green means fine and amber means degraded, with no text, shape or icon to say so. Anyone who cannot distinguish those colours gets no status at all - and this stays broken even after alt text is added.",
    compare:"The contract badge in “plan details” pairs its colour with the words “Active until 31 Mar 2027”, so the colour is reinforcement rather than the only signal." },
  { id:11, label:"Chart alternative text", title:"The usage chart has alt text that says nothing",
    pour:"Perceivable", wcag:"1.1.1", auto:"human",
    note:"The chart shows its title, monthly values and labels clearly on screen - a sighted user reads it at a glance. Its alt text is just alt=\"chart\", so a screen-reader user gets none of that. A scanner only checks that alt EXISTS, so it passes clean.",
    compare:"The contract badge uses alt that carries the actual information. Ask of every alt: could I delete the image and lose nothing?" },
];

const T = {
  bg:"#f4f6f9", surface:"#ffffff", line:"#dbe1e8", panel:"#eef1f5",
  ink:"#16191d", muted:"#5a6572",
  brand:"#0a5bd3", brandDark:"#0847a3", brandSoft:"#eef2f8", brandBorder:"#c3d2e8",
  good:"#1c7a3e", bad:"#b3261e", warn:"#8a5a00", focus:"#ffab00",
  sans:"'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif",
};

function App(){
  const [found,setFound]   = useState({});
  const [team,setTeam]     = useState("");
  const [started,setStart] = useState(false);
  const [secs,setSecs]     = useState(0);
  const [mins,setMins]     = useState(10);
  const [force,setForce]   = useState(false);
  const [modal,setModal]   = useState(false);
  const [err,setErr]       = useState(false);
  const [news,setNews]     = useState("");
  const [nlMsg,setNlMsg]   = useState("");   // live-region content (starts empty)
  const [details,setDet]   = useState(false);
  const dlgRef             = useRef(null);

  useEffect(()=>{ if(!started) return;
    const t=setInterval(()=>setSecs(s=>s+1),1000); return ()=>clearInterval(t); },[started]);

  // DEFECT 7 (part 1): focus is pulled into the dialog, and never returned on close.
  useEffect(()=>{ if(modal && dlgRef.current) dlgRef.current.focus(); },[modal]);

  const count=Object.values(found).filter(Boolean).length;
  const won=count===BUGS.length;
  const toggle=id=>setFound(f=>({...f,[id]:!f[id]}));
  const pad=n=>String(n).padStart(2,"0");
  const mm=pad(Math.floor(secs/60)), ss=pad(secs%60);
  const target=mins*60, revealed=force||(started&&secs>=target);
  const left=Math.max(0,target-secs);
  const rmm=pad(Math.floor(left/60)), rss=pad(left%60);

  /* styles for the app under test */
  const S={
    input:{width:"100%",padding:"11px 13px",background:"#fff",border:`1px solid ${T.line}`,
           borderRadius:8,color:T.ink,font:"inherit",fontSize:14},
    label:{display:"block",fontSize:13,fontWeight:650,margin:"0 0 6px",color:T.ink},
    field:{margin:"0 0 16px"},
    btn:{background:T.brand,color:"#fff",border:"none",borderRadius:8,padding:"11px 18px",
         font:"inherit",fontSize:14,fontWeight:650,cursor:"pointer"},
    btn2:{background:T.brandSoft,color:T.brand,border:`1px solid ${T.brandBorder}`,
          borderRadius:8,padding:"11px 18px",font:"inherit",fontSize:14,fontWeight:650,cursor:"pointer"},
    card:{background:T.surface,border:`1px solid ${T.line}`,borderRadius:12,padding:22,margin:"0 0 18px"},
    h2:{fontSize:19,margin:"0 0 10px",letterSpacing:"-.01em"},
    muted:{color:T.muted,fontSize:14},
  };

  // The chart is fully readable ON SCREEN (title, values, month labels). The defect
  // is that none of it is available as text - see defect 11.
  const usageChart="data:image/svg+xml;utf8,"+encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='540' height='128'><rect width='540' height='128' fill='#f7f9fc'/><text x='16' y='18' fill='#16191d' font-size='12' font-weight='600' font-family='sans-serif'>Data use per month (GB)</text><line x1='16' y1='98' x2='524' y2='98' stroke='#c8d2de'/><rect x='34' y='63' width='48' height='35' fill='#0a5bd3'/><text x='58' y='57' fill='#16191d' font-size='12' font-weight='600' text-anchor='middle' font-family='sans-serif'>14</text><text x='58' y='114' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>Jan</text><rect x='116' y='50' width='48' height='48' fill='#0a5bd3'/><text x='140' y='44' fill='#16191d' font-size='12' font-weight='600' text-anchor='middle' font-family='sans-serif'>19</text><text x='140' y='114' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>Feb</text><rect x='198' y='43' width='48' height='55' fill='#0a5bd3'/><text x='222' y='37' fill='#16191d' font-size='12' font-weight='600' text-anchor='middle' font-family='sans-serif'>22</text><text x='222' y='114' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>Mar</text><rect x='280' y='56' width='48' height='42' fill='#0a5bd3'/><text x='304' y='50' fill='#16191d' font-size='12' font-weight='600' text-anchor='middle' font-family='sans-serif'>17</text><text x='304' y='114' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>Apr</text><rect x='362' y='48' width='48' height='50' fill='#0a5bd3'/><text x='386' y='42' fill='#16191d' font-size='12' font-weight='600' text-anchor='middle' font-family='sans-serif'>20</text><text x='386' y='114' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>May</text><rect x='444' y='70' width='48' height='28' fill='#0a5bd3'/><text x='468' y='64' fill='#16191d' font-size='12' font-weight='600' text-anchor='middle' font-family='sans-serif'>11</text><text x='468' y='114' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>Jun</text></svg>`);
  const okBadge="data:image/svg+xml;utf8,"+encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='210' height='34'><rect width='210' height='34' fill='#e4f4e9'/><circle cx='19' cy='17' r='6' fill='#1c7a3e'/><text x='34' y='22' fill='#14562c' font-size='12' font-family='sans-serif'>Active until 31 Mar 2027</text></svg>`);
  const statusMap="data:image/svg+xml;utf8,"+encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='540' height='78'><rect width='540' height='78' fill='#f7f9fc'/><circle cx='88' cy='32' r='9' fill='#1c7a3e'/><circle cx='256' cy='32' r='9' fill='#1c7a3e'/><circle cx='424' cy='32' r='9' fill='#c98a00'/><text x='88' y='62' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>Zurich</text><text x='256' y='62' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>Bern</text><text x='424' y='62' fill='#5a6572' font-size='11' text-anchor='middle' font-family='sans-serif'>Geneve</text></svg>`);

  return (
    <div style={{background:T.bg,color:T.ink,fontFamily:T.sans,minHeight:"100vh"}}>
      <style>{`
        *{box-sizing:border-box}
        @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

        /* CORRECT BY DESIGN: everything in the app under test gets a clear focus ring,
           so the one place it is missing (defect 6) stands out by comparison. */
        #app button:focus-visible, #app a:focus-visible, #app input:focus-visible,
        #app select:focus-visible, #app textarea:focus-visible, #app [tabindex]:focus-visible{
          outline:3px solid ${T.focus}; outline-offset:2px; border-radius:8px;
        }
        /* PLANTED DEFECT 6: focus suppressed on the quick links only */
        #app .quick a:focus, #app .quick a:focus-visible{ outline:none; }

        /* The facilitator panel is intentionally OUTSIDE the test:
           removed from the tab order so it never appears in a keyboard pass. */
        #tracker button:focus-visible, #tracker input:focus-visible, #tracker select:focus-visible{
          outline:2px dashed ${T.brand}; outline-offset:2px;
        }
        #tracker input::placeholder{color:#6b7684;opacity:1}
      `}</style>

      <div style={{display:"grid",gridTemplateColumns:"1fr 390px",minHeight:"100vh"}}>

        {/* ================= APP UNDER TEST ================= */}
        <div id="app" style={{borderRight:`1px solid ${T.line}`}}>
          <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 28px",
            background:T.surface,borderBottom:`1px solid ${T.line}`}}>
            <span style={{display:"flex",alignItems:"center",gap:10,fontWeight:750}}>
              <span style={{width:26,height:26,borderRadius:7,display:"grid",placeItems:"center",
                background:T.brand,color:"#fff",fontWeight:800,fontSize:14}}>M</span>MyTelco</span>
            <span style={{marginLeft:"auto",fontSize:13,color:T.muted}}>Self-service portal</span>
          </div>

          <div style={{padding:"26px 28px 56px",maxWidth:700}}>
            <h1 style={{fontSize:27,letterSpacing:"-.02em",margin:"0 0 4px"}}>Account overview</h1>
            {/* DEFECT 2: low contrast */}
            <p style={{color:"#c2c8d0",fontSize:13,margin:"0 0 4px"}}>Last synced a few moments ago</p>
            {/* correct counterpart: readable secondary text */}
            <p style={{color:T.muted,fontSize:13,margin:"0 0 20px"}}>Account 7741 0092 · Zurich region</p>

            {/* quick links - DEFECT 6 lives here (focus ring suppressed) */}
            <div className="quick" style={{display:"flex",gap:18,margin:"0 0 22px",fontSize:14}}>
              <a href="#billing" style={{color:T.brand}}>Billing</a>
              <a href="#roaming" style={{color:T.brand}}>Roaming</a>
              <a href="#devices" style={{color:T.brand}}>Devices</a>
            </div>

            <div style={S.card}>
              {/* correct h2 */}
              <h2 style={S.h2}>Your usage</h2>
              {/* DEFECT 9: a real data table with no <th>, no scope and no caption.
                  A screen reader reads the cells with no row or column context, so the
                  figures lose the labels that sighted users get from the layout. */}
              <table style={{width:"100%",borderCollapse:"separate",borderSpacing:"14px 0",
                marginBottom:16,tableLayout:"fixed"}}>
                <tbody>
                  <tr>
                    <td style={{background:T.panel,borderRadius:10,padding:16,fontSize:25,fontWeight:800}}>CHF 49.90</td>
                    <td style={{background:T.panel,borderRadius:10,padding:16,fontSize:25,fontWeight:800}}>18 GB</td>
                    <td style={{background:T.panel,borderRadius:10,padding:16,fontSize:25,fontWeight:800}}>4</td>
                  </tr>
                  <tr>
                    <td style={{fontSize:12,color:T.muted,textTransform:"uppercase",paddingTop:6}}>Monthly plan</td>
                    <td style={{fontSize:12,color:T.muted,textTransform:"uppercase",paddingTop:6}}>Data used</td>
                    <td style={{fontSize:12,color:T.muted,textTransform:"uppercase",paddingTop:6}}>Devices</td>
                  </tr>
                </tbody>
              </table>
              {/* CORRECT: image with a meaningful alt */}
              {/* DEFECT 11: the chart is fully readable on screen (title, values, months) but
                  its alt text is just "chart", so none of that reaches a screen reader.
                  A scanner only checks that alt EXISTS, so it passes clean. */}
              <img src={usageChart} width="540" alt="chart"
                   style={{maxWidth:"100%",borderRadius:8,border:`1px solid ${T.line}`}} />
              <p style={{...S.muted,marginTop:16}}>Network status:</p>
              {/* DEFECT 3: no alt */}
              <img src={statusMap} width="540"
                   style={{maxWidth:"100%",borderRadius:8,border:`1px solid ${T.line}`}} />
            </div>

            <div style={S.card}>
              {/* DEFECT 4: h1 -> h4 skip */}
              <h4 style={{fontSize:19,margin:"0 0 10px",letterSpacing:"-.01em"}}>Manage your plan</h4>
              <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
                {/* CORRECT: real button */}
                <button style={S.btn} onClick={()=>alert("Upgrade started (demo)")}>Upgrade plan</button>
                {/* DEFECT 5: div dressed as a button */}
                <div onClick={()=>alert("Downgrade started (demo)")} style={{...S.btn2,display:"inline-block"}}>
                  Downgrade plan</div>
              </div>

              {/* CORRECT: a proper disclosure - keyboard operable, state announced */}
              <button style={{...S.btn2,marginTop:16}} aria-expanded={details}
                      onClick={()=>setDet(d=>!d)}>
                {details?"Hide":"Show"} plan details</button>
              {details && (
                <div style={{marginTop:12}}>
                  <p style={S.muted}>Unlimited calls and SMS in Switzerland,
                    20 GB data, EU roaming included. Minimum term 12 months.</p>
                  {/* CORRECT: an image whose alt actually carries the information */}
                  <img src={okBadge} width="210" alt="Contract status: active until 31 March 2027."
                       style={{borderRadius:8,border:`1px solid ${T.line}`,marginTop:6}} />
                </div>
              )}
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
              <div style={S.card}>
                <h2 style={S.h2}>Contact support</h2>
                {/* DEFECT 1: a visible text label that is NOT associated with the input.
                    No <label for>, no aria-label, no placeholder -> the field has no
                    accessible name at all. A screen reader announces only "edit, blank". */}
                <div style={S.field}>
                  <div style={S.label}>Full name</div>
                  <input style={S.input} type="text" />
                </div>
                {/* CORRECT: properly labelled */}
                <div style={S.field}>
                  <label style={S.label} htmlFor="em">Email address</label>
                  <input id="em" style={S.input} type="email" />
                </div>
                <button style={S.btn} onClick={()=>setErr(true)}>Submit ticket</button>
                <button style={{...S.btn2,marginLeft:8}} onClick={()=>setModal(true)}>Support hours</button>
                {/* DEFECT 8: error not announced, not tied to the field */}
                {err && <div style={{color:T.bad,fontSize:13,marginTop:12}}>
                  Please complete the required fields.</div>}
              </div>

              <div style={S.card}>
                <h2 style={S.h2}>Newsletter</h2>
                {/* CORRECT: labelled field + live region for the result */}
                <div style={S.field}>
                  <label style={S.label} htmlFor="nl">Email for updates</label>
                  <input id="nl" style={S.input} type="email"
                         value={news} onChange={e=>setNews(e.target.value)}
                         aria-describedby="nlmsg" />
                </div>
                <button style={S.btn} onClick={()=>setNlMsg(
                    news.trim()
                      ? "Thanks - we will send updates to "+news.trim()+"."
                      : "Please enter an email address."
                  )}>Subscribe</button>
                {/* CORRECT: the live region is always in the DOM and starts empty, so when
                    its text changes it is announced. Compare with the ticket form error. */}
                <div id="nlmsg" role="status" aria-live="polite" aria-atomic="true"
                     style={{fontSize:13,marginTop:12,minHeight:18,
                       color: nlMsg.startsWith("Please") ? T.bad : T.good}}>
                  {nlMsg}
                </div>
                <p style={{fontSize:12.5,color:T.muted,margin:"6px 0 0"}}>
                  We will confirm here after you subscribe.</p>
              </div>
            </div>
          </div>
        </div>

        {/* ============ FACILITATOR PANEL (outside the test) ============ */}
        <aside id="tracker" aria-label="Defect tracker (facilitator panel)"
          style={{background:T.surface,padding:24,position:"sticky",top:0,
            height:"100vh",overflowY:"auto",borderLeft:`1px solid ${T.line}`}}>

          <div style={{background:"#fff8e6",border:"1px solid #f0d488",borderRadius:8,
            padding:"8px 11px",fontSize:12,color:"#6b4a00",marginBottom:16}}>
            Facilitator panel — deliberately kept out of the tab order, so it never
            shows up in your keyboard or screen-reader pass.
          </div>

          <h2 style={{fontSize:14,fontWeight:750,letterSpacing:".07em",textTransform:"uppercase",
            color:T.brand,margin:"0 0 4px"}}>Defect tracker</h2>
          <p style={{fontSize:14,color:T.muted,margin:"0 0 16px"}}>
            One page · {BUGS.length} planted defects · only {BUGS.filter(b=>b.auto==="scanner").length} of them a scanner can find</p>

          {!started ? (
            <div style={{background:T.panel,border:`1px solid ${T.line}`,borderRadius:12,padding:18}}>
              <label style={{...S.label,fontSize:14}} htmlFor="team">Team name</label>
              <input id="team" tabIndex={-1} style={S.input} value={team}
                     onChange={e=>setTeam(e.target.value)} placeholder="e.g. Focus Trap Four" />
              <label style={{...S.label,fontSize:14,marginTop:14}} htmlFor="rev">
                Reveal the details after</label>
              <select id="rev" tabIndex={-1} value={mins} style={S.input}
                      onChange={e=>setMins(Number(e.target.value))}>
                <option value={0}>No delay</option>
                <option value={5}>5 minutes</option>
                <option value={10}>10 minutes</option>
                <option value={15}>15 minutes</option>
              </select>
              <p style={{fontSize:13,color:T.muted,margin:"10px 0 0",lineHeight:1.5}}>
                Hunt with the tools first. Tick the type of each defect you find; the full
                descriptions unlock when the timer ends.</p>
              <button tabIndex={-1} style={{...S.btn,marginTop:14,width:"100%"}}
                      onClick={()=>setStart(true)}>Start the hunt</button>
            </div>
          ) : (
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              fontSize:15,marginBottom:14}}>
              <span style={{fontWeight:650}}>{team||"Team 1"}</span>
              <span style={{color:T.brand,fontWeight:700}}>⏱ {mm}:{ss}</span>
            </div>
          )}

          {started && (
            <div style={{fontSize:15,marginBottom:16}}>
              Found: <b style={{color:T.good,fontSize:20}}>{count}</b>
              <span style={{color:T.muted}}> / {BUGS.length}</span>
              <div style={{height:8,background:T.panel,border:`1px solid ${T.line}`,
                borderRadius:99,marginTop:8}}>
                <div style={{height:"100%",width:`${count/BUGS.length*100}%`,
                  background:T.good,borderRadius:99,transition:"width .3s"}} />
              </div>
            </div>
          )}

          {started && !revealed && (
            <div style={{background:T.panel,border:`1px solid ${T.line}`,borderRadius:12,
              padding:18,textAlign:"center"}}>
              <div style={{fontSize:24}}>🔒</div>
              <p style={{fontSize:15,fontWeight:650,margin:"4px 0 2px"}}>Details unlock in</p>
              <p style={{fontSize:31,fontWeight:800,color:T.brand,margin:"0 0 14px"}}>{rmm}:{rss}</p>
              <ul style={{listStyle:"none",padding:0,margin:"0 0 14px",display:"grid",gap:8}}>
                {BUGS.map(b=>(
                  <li key={b.id}>
                    <button tabIndex={-1} onClick={()=>toggle(b.id)} aria-pressed={!!found[b.id]}
                      style={{width:"100%",display:"flex",alignItems:"center",gap:9,
                        padding:"9px 11px",borderRadius:8,cursor:"pointer",textAlign:"left",
                        border:`1px solid ${T.line}`,font:"inherit",fontSize:13.5,
                        background:found[b.id]?"#e4f4e9":T.surface,
                        color:found[b.id]?T.good:T.ink}}>
                      <span style={{width:18,height:18,borderRadius:4,flexShrink:0,
                        display:"grid",placeItems:"center",fontSize:12,fontWeight:800,color:"#fff",
                        border:`2px solid ${found[b.id]?T.good:"#9aa4b0"}`,
                        background:found[b.id]?T.good:"transparent"}}>
                        {found[b.id]?"✓":""}</span>
                      {b.label}
                    </button>
                  </li>
                ))}
              </ul>
              <button tabIndex={-1} onClick={()=>setForce(true)}
                style={{...S.btn2,width:"100%",fontSize:13}}>Facilitator: reveal now</button>
            </div>
          )}

          {revealed && (
            <ul style={{listStyle:"none",padding:0,margin:0}}>
              {BUGS.map(b=>(
                <li key={b.id} style={{border:`1px solid ${T.line}`,borderRadius:10,
                  margin:"0 0 10px",background:T.surface}}>
                  <div style={{display:"flex",gap:10,alignItems:"flex-start",padding:"12px 13px"}}>
                    <button tabIndex={-1} onClick={()=>toggle(b.id)} aria-pressed={!!found[b.id]}
                      style={{width:22,height:22,borderRadius:5,flexShrink:0,marginTop:1,padding:0,
                        cursor:"pointer",display:"grid",placeItems:"center",fontSize:13,
                        fontWeight:800,color:"#fff",
                        border:`2px solid ${found[b.id]?T.good:"#9aa4b0"}`,
                        background:found[b.id]?T.good:"transparent"}}>
                      {found[b.id]?"✓":""}</button>
                    <div style={{flex:1}}>
                      <span style={{fontSize:14,fontWeight:650,lineHeight:1.4,display:"block",
                        color:found[b.id]?T.muted:T.ink,
                        textDecoration:found[b.id]?"line-through":"none"}}>{b.title}</span>
                      <span style={{fontSize:12.5,color:T.muted,display:"block",marginTop:4}}>
                        #{b.id} · WCAG {b.wcag} · {b.pour}</span>
                    </div>
                  </div>
                  <div style={{padding:"0 13px 13px 45px",fontSize:13,color:T.ink}}>
                    <p style={{margin:"0 0 8px",lineHeight:1.5}}>{b.note}</p>
                    <p style={{margin:"0 0 8px",lineHeight:1.5,color:T.muted}}>
                      <b style={{color:T.good}}>Correct version:</b> {b.compare}</p>
                    <p style={{margin:0,fontSize:13,fontWeight:650}}>
                      Scanner:{" "}
                      <b style={{color:b.auto==="scanner"?T.good:T.bad}}>
                        {b.auto==="scanner"?"✔ detects it":"✘ cannot detect"}</b></p>
                  </div>
                </li>
              ))}
            </ul>
          )}

          {won && (
            <div style={{textAlign:"center",padding:16,background:"#e4f4e9",
              border:`2px solid ${T.good}`,borderRadius:10,marginTop:10}}>
              <div style={{fontSize:20,fontWeight:800,color:T.good}}>All {BUGS.length} found in {mm}:{ss}</div>
              <p style={{margin:"8px 0 0",fontSize:14,lineHeight:1.5}}>
                {BUGS.filter(b=>b.auto==="human").length} of these {BUGS.length} would have
                slipped past an automated scan.</p>
            </div>
          )}
        </aside>
      </div>

      {/* DEFECT 7: a real keyboard trap. Focus is moved in, Tab and Esc are swallowed,
          and the only close control is a <div> with a click handler - so there is no
          keyboard way out at all. Mouse click on "Got it" closes it. */}
      {modal && (
        <div style={{position:"fixed",inset:0,background:"rgba(22,25,29,.45)",display:"grid",
          placeItems:"center",padding:20,zIndex:50}}
          onKeyDown={(e)=>{
            if(e.key==="Tab" || e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); }
          }}>
          <div ref={dlgRef} tabIndex={-1}
            style={{background:"#fff",border:`1px solid ${T.line}`,borderRadius:14,
              padding:26,maxWidth:420,width:"100%",outline:"none"}}>
            <h3 style={{margin:"0 0 8px",fontSize:17}}>Support hours</h3>
            <p style={{color:T.muted,fontSize:14,margin:0,lineHeight:1.5}}>
              Mon–Fri, 08:00–18:00 CET. For outages call 0800 000 000 any time.</p>
            {/* mouse-only close: a div, not a button */}
            <div onClick={()=>setModal(false)}
              style={{...S.btn,marginTop:16,display:"inline-block"}}>Got it</div>
          </div>
        </div>
      )}
    </div>
  );
}

(function mount(){
  const s=document.getElementById("status");
  try{
    if(typeof React==="undefined"||typeof ReactDOM==="undefined"){
      s.innerHTML='<div class="err">Could not load React from the CDN. This page needs internet access on first load.</div>';
      return;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    s.classList.add("hidden");
  }catch(e){
    s.innerHTML='<div class="err">The app failed to start.<br>'+String(e&&e.message?e.message:e)+'</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
